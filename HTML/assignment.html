<!DOCTYPE html>
<html>
<head>
    <title>Table Example</title>
</head>
<body>

<table border="1" cellpadding="10" cellspacing="0">

    <!-- Row 1 -->
    <tr>
        <td rowspan="2">
            <img src="https://share.google/8v499qbFPgExPrigx" width="100" height="100" alt="Image">
        </td>
        <td colspan="2">100</td>
    </tr>

    <!-- Row 2 -->
    <tr>
        <td>200</td>
        <td>300</td>
    </tr>

    <!-- Row 3 -->
    <tr>
        <td>400</td>
        <td colspan="2">500</td>
    </tr>

    <!-- Row 4 -->
    <tr>
        <td>600</td>
        <td>700</td>
        <td>800</td>
    </tr>

    <!-- Row 5 -->
    <tr>
        <td rowspan="2">900</td>
        <td>1000</td>
        <td>1100</td>
    </tr>

    <!-- Row 6 -->
    <tr>
        <td colspan="2">1200</td>
    </tr>

    <!-- Row 7 -->
    <tr>
        <td>1300</td>
        <td>1400</td>
        <td>1500</td>
    </tr>

    <!-- Row 8 -->
    <tr>
        <td colspan="2">1600</td>
        <td>1700</td>
    </tr>

    <!-- Row 9 -->
    <tr>
        <td>1800</td>
        <td rowspan="2">1900</td>
        <td>2000</td>
    </tr>

    <!-- Row 10 -->
    <tr>
        <td>2100</td>
        <td>2200</td>
    </tr>

</table>

</body>
</html>
