<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>
</head>

<body>

    <table style="width: 90%; margin: 20px auto; border: 5px solid green; border-collapse: collapse; font-family: Arial, sans-serif;">

        <!-- Table Title -->
        <tr>
            <th colspan="3"
                style="font-size: 40px; font-weight: normal; padding: 10px; border-bottom: 12px solid darkred;">
                Student Table
            </th>
        </tr>

        <!-- Table Header -->
        <tr>
            <th style="border: 2px solid black; padding: 12px; font-size: 28px;">
                Roll No.
            </th>

            <th style="border: 2px solid black; padding: 12px; font-size: 28px;">
                Student Name
            </th>

            <th style="border: 2px solid black; padding: 12px; font-size: 28px;">
                Course
            </th>
        </tr>

        <!-- Student 1 -->
        <tr>
            <td style="border: 2px solid black; padding: 12px; font-size: 28px;">
                101
            </td>

            <td style="border: 2px solid black; padding: 12px; font-size: 28px;">
                Amey Wagh
            </td>

            <td style="border: 2px solid black; padding: 12px; font-size: 28px;">
                B.Tech in CSE
            </td>
        </tr>

        <!-- Student 2 -->
        <tr>
            <td style="border: 2px solid black; padding: 12px; font-size: 28px;">
                102
            </td>

            <td style="border: 2px solid black; padding: 12px; font-size: 28px;">
                Harry Potter
            </td>

            <td style="border: 2px solid black; padding: 12px; font-size: 28px;">
                Doctor
            </td>
        </tr>

        <!-- Student 3 -->
        <tr>
            <td style="border: 2px solid black; padding: 12px; font-size: 28px;">
                103
            </td>

            <td style="border: 2px solid black; padding: 12px; font-size: 28px;">
                Karan Johar
            </td>

            <td style="border: 2px solid black; padding: 12px; font-size: 28px;">
                Hotel management
            </td>
        </tr>

    </table>

</body>
</html>
