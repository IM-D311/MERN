<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 4</title>
</head>

<body>

    <h1 style="text-align: center; font-weight: normal;">
        Table 4
    </h1>

    <table style="width: 650px; margin: auto; border: 2px solid black; border-collapse: collapse; text-align: center;">

        <!-- First Row -->
        <tr>
            <td colspan="2"
                style="width: 70%; height: 100px; border: 2px solid black; font-size: 48px; font-weight: bold;">
                1
            </td>

            <td style="width: 15%; border: 2px solid black; font-size: 48px; font-weight: bold;">
                3
            </td>

            <td style="width: 15%; border: 2px solid black; font-size: 48px; font-weight: bold;">
                4
            </td>
        </tr>

        <!-- Main Middle Section -->
        <tr>

            <!-- Nested Table -->
            <td colspan="2"
                style="border: 2px solid black; padding: 10px;">

                <table style="width: 100%; border: 3px solid black; border-collapse: collapse;">

                    <tr>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">11</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">12</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">13</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">14</td>
                    </tr>

                    <tr>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">15</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">16</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">17</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">18</td>
                    </tr>

                    <tr>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">19</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">20</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">21</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">22</td>
                    </tr>

                    <tr>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">23</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">24</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">25</td>
                        <td style="border: 2px solid black; padding: 15px; font-size: 40px;">26</td>
                    </tr>

                </table>

            </td>

            <!-- 3 -->
            <td rowspan="2"
                style="border: 2px solid black; font-size: 42px;">
                3
            </td>

            <!-- 4 -->
            <td rowspan="2"
                style="border: 2px solid black; font-size: 42px;">
                4
            </td>

        </tr>

        <!-- 7 and 8 -->
        <tr>
            <td colspan="2"
                style="border: 2px solid black; height: 100px; font-size: 48px;">
                7
            </td>
        </tr>

        <!-- 9, 11, 12 -->
        <tr>
            <td colspan="2"
                style="border: 2px solid black; height: 80px; font-size: 48px;">
                9
            </td>

            <td style="border: 2px solid black; font-size: 40px;">
                11
            </td>

            <td style="border: 2px solid black; font-size: 40px;">
                12
            </td>
        </tr>

        <!-- 13, 15, 16 -->
        <tr>
            <td colspan="2"
                style="border: 2px solid black; height: 80px; font-size: 48px;">
                13
            </td>

            <td style="border: 2px solid black; font-size: 40px;">
                15
            </td>

            <td style="border: 2px solid black; font-size: 40px;">
                16
            </td>
        </tr>

    </table>

</body>
</html>
